<body>
    <h1>{{ track.name }} - {{ track.artist }}</h1>
    <img src="{{ track.image }}" alt="{{ track.name }}" width="200">
    <p><strong>再生回収：</strong> {{ track.playcount }}</p>
    <p><strong>タグ：</strong> {{ track.tags|join:"," }}</p>
    <p><strong>公開日：</strong> {{ track.published }}</p>
    <p><strong>概要：</strong> {{ track.summary|safe }}</p>

    <h2>類似曲</h2>
    {% if similar_tracks %}
        <ul style="list-style:none; padding:0;">
            {% for sim in similar_tracks %}
                <li style="display: inline-block; margin-right: 10px; text-align: center;">
                    <a href="{{ sim.url }}" target="_blank">
                        <img src="{{ sim.image }}" alt="{{ sim.name }}" style="width: 60px; height: 60px;"><br>
                    </a>
                </li>
            {% endfor %}
        </ul>

    {% else %}
        <p>類似曲は見つかりませんでした。</p>
    {% endif %}

    <p><a href="{% url 'search_track' %}?q={{ track.name }}">検索結果に戻る。</a></p>
</body>
