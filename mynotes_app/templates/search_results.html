<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>トラック検索結果</title>
        <style>
            
        </style>
    </head>
    <body>
        <h1>「{{ query }}」の検索結果</h1>

        {% if tracks %}
            {% for track in tracks %}
                <div class="track" style="margin-bottom: 2rem;">
                    <div>
                        <h3>{{ track.name }} - {{ track.artist }}</h3>
                        <img src="{{ track.image }}" alt="ジャケット" width="150">
                        <p><strong>再生回数：</strong> {{ track.playcount }} </p>
                        <p><strong>タグ：</strong> {{track.tags|join:"," }} </p>
                        <p><strong>公開日：</strong> {{ track.published }} </p>
                        <p><strong>概要：</strong> {{ track.summary|safe }} </p>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p>曲が見つかりませんでした。</p>
        {% endif %}
    <body>
</html>
